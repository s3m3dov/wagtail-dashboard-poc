{% extends "base.html" %}
{% load static %}
{% block title %}Simple Report - Bar Chart{% endblock %}
{% block body_class %}django-chartjs line chart demo{% endblock %}

{% block extra_css %}
{% endblock extra_css %}

{% block content %}
    <div id="container" style="width: 75%;">
        <canvas id="simple-report" data-url="{{simple_report.get_json_url}}"></canvas>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script>
        $(function () {
            var $bar_chart = $("#simple-report");
            $.ajax({
                url: $bar_chart.data("url"),
                success: function (data) {
                    var ctx = $bar_chart[0].getContext("2d");
            
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Users',
                                backgroundColor: createListOfRandomColors(data.labels.length),
                                borderWidth: 3,
                                data: data.data,
                            }]          
                        },
                        options: {
                            responsive: true,
                            legend: {
                                position: 'top',
                                display: false
                            },
                            title: {
                                display: true,
                                text: data.report_type
                            },
                            scales: {
                                yAxes: [{
                                    ticks: {
                                        beginAtZero: true,
                                        stepSize: 10,
                                    }
                                }]
                            }
                        }
                    });
                }
            });
        });

        var $bar_chart = $("#simple-report");
        $.ajax({
            url: $bar_chart.data("url"),
            success: function (data) {
                // ...
            }
        })
    </script>
{% endblock %}
