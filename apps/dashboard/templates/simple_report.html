{% extends "base.html" %}
{% load static %}
{% block title %}Simple Report - Bar Chart{% endblock %}
{% block body_class %}django-chartjs line chart demo{% endblock %}

{% block extra_css %}
{% endblock extra_css %}

{% block content %}
    <h1>Simple Reports</h1>

    <div id="container" style="width: 75%;">
        <canvas id="simple-report" data-url="{% url 'simple_report_json' %}"></canvas>
    </div>
    

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.3/dist/Chart.min.js"></script>
    <script>
        function getRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function createListOfRandomColors(length) {
            colorList = [];
            for (var i = 0; i < length; i++) {
                colorList.push(getRandomColor())
            }
            return colorList;
        }

        $(function () {
            var $populationChart = $("#simple-report");
            $.ajax({
                url: $populationChart.data("url"),
                success: function (data) {
                    var ctx = $populationChart[0].getContext("2d");
            
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Users',
                                backgroundColor: createListOfRandomColors(data.labels.length),
                                borderWidth: 3,
                                data: data.data,
                            }]          
                        },
                        options: {
                            responsive: true,
                            legend: {
                                position: 'top',
                                display: false
                            },
                            title: {
                                display: true,
                                text: 'Users by Country'
                            },
                            scales: {
                                yAxes: [{
                                    ticks: {
                                        beginAtZero: true,
                                        stepSize: 5,
                                    }
                                }]
                            }
                        }
                    });
                }
            });
        });
        var $populationChart = $("#simple-report");
        $.ajax({
            url: $populationChart.data("url"),
            success: function (data) {
                // ...
            }
        })
    </script>
{% endblock content %}
